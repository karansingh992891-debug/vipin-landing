<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIPIN SINGH | Work From Home</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#0f172a,#2563eb,#06b6d4,#3b82f6);
background-size:400% 400%;
animation:bg 12s ease infinite;
overflow:hidden;

}

@keyframes bg{

0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}

}

.card{

width:90%;
max-width:430px;

background:rgba(255,255,255,.12);

backdrop-filter:blur(20px);

border-radius:25px;

padding:35px;

text-align:center;

box-shadow:0 20px 60px rgba(0,0,0,.35);

border:1px solid rgba(255,255,255,.2);

animation:up 1s;

}

@keyframes up{

from{

opacity:0;
transform:translateY(40px);

}

to{

opacity:1;
transform:translateY(0);

}

}

.logo{

font-size:32px;
font-weight:700;
color:#fff;

}

.title{

font-size:38px;
font-weight:700;
margin-top:20px;
color:#fff;

}

.text{

margin-top:15px;
font-size:16px;
line-height:28px;
color:#f5f5f5;

}

.telegram{

display:block;

margin-top:35px;

padding:18px;

border-radius:15px;

text-decoration:none;

font-size:22px;

font-weight:700;

background:#229ED9;

color:#fff;

transition:.3s;

}

.telegram:hover{

transform:scale(1.05);

}

</style>

</head>

<body>

<div class="card">

<div class="logo">
VIPIN SINGH
</div>

<div class="title">
COLOUR TRADING OFFICIAL
</div>

<div class="text">

Join our official Telegram channel to learn more about this work opportunity.

</div>

<a class="telegram"
href="https://https://t.me/+p5wU7cEtycNhNzhl

🚀 JOIN TELEGRAM

</a>

</div>

</body>

</html>
